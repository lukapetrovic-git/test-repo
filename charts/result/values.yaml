# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# ReplicaSet pod count
replicaCount: 1

# Additional labels to add to all objects
additionalLabels:
  app: result

image:
  # Application image repository
  repository: dockersamples/examplevotingapp_result
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Application image tag
  tag: latest

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}
  # runAsNonRoot: true
  # seccompProfile:
  #   type: "RuntimeDefault"

# Container security context
securityContext: {}
  # privileged: false
  # allowPrivilegeEscalation: false
  # capabilities:
  #   drop: ["ALL"]
  # readOnlyRootFilesystem: true

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /
    port: 80
readinessProbe:
  httpGet:
    path: /
    port: 80

# Container resources
resources:
  limits:
    # cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Set affinity (poAffinity, podAntiAffinity, nodeAffinity)
affinity: {}

# Service settings
service:
  # Service type
  type: ClusterIP
  # Service port
  port: 80
  # Container port
  targetPort: 80
  # Container port
  protocol: TCP

# Ingress settings # TBD AWS
ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: result.example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
